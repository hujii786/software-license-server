<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Software Hub - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <nav class="navbar glass-nav">
        <a href="/" class="brand">
            <div class="brand-icon">⚡</div>
            <div class="brand-title">Software<span>Server</span> Hub</div>
        </a>
        <div style="font-size: 0.85rem; color: var(--text-muted);">
            Central License & Distribution Hub
        </div>
    </nav>

    <div class="hero-wrapper">
        <div class="glass login-card">
            <div class="login-icon">🔐</div>
            <h2 style="text-align: center; margin-bottom: 0.5rem; font-size: 1.6rem;">Welcome Back</h2>
            <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">
                Apne account mein login karein (Admin ya Customer)
            </p>

            <div id="login-error" style="display: none; padding: 0.75rem; border-radius: var(--radius-sm); background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; font-size: 0.85rem; margin-bottom: 1.25rem; text-align: center;"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="e.g. admin ya client username" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter password" required>
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
                    Sign In to Portal
                </button>
            </form>

            <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); text-align: center;">
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem;">Default Admin Credentials:</p>
                <div style="display: inline-flex; gap: 0.75rem; font-size: 0.78rem;">
                    <span class="key-box">User: admin</span>
                    <span class="key-box">Pass: admin123</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('login-error');
            const submitBtn = document.getElementById('login-btn');

            errorBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (response.ok) {
                    if (data.user.role === 'admin') {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/portal';
                    }
                } else {
                    errorBox.textContent = data.detail || 'Login failed! Please check credentials.';
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = 'Server connection error. Please make sure server is running.';
                errorBox.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In to Portal';
            }
        });
    </script>
</body>
</html>
